<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Calendario">
<link rel="apple-touch-icon" href="icono.png">
<link rel="icon" href="icono.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Calendario</title>
<style>
  :root {
    --tinta: #1c1c1f; --gris: #6f6e77; --suave: #a1a1aa; --linea: #e8e8ec; --fondo-dia: #fafafb; --acento: #1c1c1f; --hoy: #3e63dd;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; color: var(--tinta); }
  body {
    font: 15px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  h1 { font-size: 22px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
  .nav { display: flex; gap: 4px; margin-left: auto; }
  button {
    font: inherit; color: var(--tinta); background: #fff; border: 1px solid var(--linea); border-radius: 8px;
    padding: 6px 12px; cursor: pointer;
  }
  button:hover { background: var(--fondo-dia); }
  .estado { width: 100%; color: var(--suave); font-size: 13px; }
  .estado.aviso { color: #c2410c; }
  .mes { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .cab { font-size: 12px; font-weight: 600; color: var(--gris); text-align: center; padding: 4px 0; text-transform: capitalize; }
  .dia {
    border: 1px solid var(--linea); border-radius: 8px; padding: 4px; background: #fff; min-height: 64px;
    cursor: pointer; overflow: hidden; display: flex; flex-direction: column; gap: 3px;
  }
  .dia.pasado { background: #f1f1f3; }
  .dia.pasado .num, .dia.pasado .chip { opacity: .55; }
  .dia.fuera .num { color: var(--suave); }
  .dia.hoy { background: #eef2ff; border: 2px solid var(--hoy); padding: 3px; }
  .dia.elegido:not(.hoy) { box-shadow: inset 0 0 0 2px var(--tinta); }
  .num { font-size: 13px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .dia.hoy .num { color: #fff; background: var(--hoy); border-radius: 999px; padding: 0 6px; align-self: flex-start; }
  .chip {
    font-size: 11px; line-height: 1.25; border-radius: 4px; padding: 1px 4px; border-left: 3px solid;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .chip .hora { font-variant-numeric: tabular-nums; font-weight: 650; margin-right: 3px; }
  .detalle { margin-top: 16px; }
  .detalle h2 { font-size: 15px; margin: 0 0 8px; }
  .vacio { color: var(--suave); font-size: 13px; }
  .item { border-radius: 8px; padding: 6px 8px; margin-bottom: 6px; font-size: 14px; overflow-wrap: anywhere; }
  .evento .titulo { font-weight: 650; color: var(--tinta); }
  .evento .hora { font-variant-numeric: tabular-nums; font-weight: 650; margin-right: 4px; }
  .evento .todo-dia { font-weight: 500; color: var(--gris); }
  .evento .materia { font-size: 12px; color: var(--gris); margin-top: 1px; }
  @media (min-width: 900px) {
    .mes { gap: 6px; }
    .dia { min-height: calc((100vh - 150px) / 6); padding: 8px; }
    .dia.hoy { padding: 7px; }
    .num { font-size: 15px; }
    .chip { font-size: 12px; padding: 2px 6px; }
    .detalle { display: none; }
  }
  @media (max-width: 899px) {
    .chip .hora, .chip .materia { display: none; }
  }
  form { max-width: 420px; margin: 12vh auto 0; }
  form p { color: var(--gris); font-size: 14px; }
  input { font: inherit; width: 100%; padding: 10px 12px; border: 1px solid var(--linea); border-radius: 8px; margin: 8px 0 12px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<form id="formToken" hidden>
  <h1>Calendario</h1>
  <p id="errorToken" class="estado aviso" hidden></p>
  <p>Pegá un token de GitHub <em>fine-grained</em> con acceso solo a <code>codetion-datos</code> y permiso <strong>Contents: Read-only</strong>. Se guarda solo en este dispositivo.</p>
  <input id="token" type="password" autocomplete="off" placeholder="github_pat_…" required>
  <button type="submit">Guardar</button>
</form>
<main id="app" hidden>
  <header>
    <h1 id="rango"></h1>
    <div class="nav">
      <button id="ant" aria-label="Mes anterior">←</button>
      <button id="hoy">Hoy</button>
      <button id="sig" aria-label="Mes siguiente">→</button>
    </div>
    <div id="estado" class="estado"></div>
  </header>
  <section id="mes" class="mes"></section>
  <section id="detalle" class="detalle"></section>
</main>
<script type="module">
import { armarMes, colorDe, ymd } from './semana.js';

const URL_DATOS = 'https://api.github.com/repos/mateogeffroy/codetion-datos/contents/calendario.json';
const K_TOKEN = 'calendario.token', K_COPIA = 'calendario.copia';
const $ = (id) => document.getElementById(id);

let datos = null, mes = new Date(), elegido = ymd(new Date()), aviso = '';

function el(tag, clase, texto) {
  const e = document.createElement(tag);
  if (clase) e.className = clase;
  if (texto !== undefined) e.textContent = texto;
  return e;
}

function haceCuanto(iso) {
  const min = Math.round((Date.now() - new Date(iso)) / 60000);
  if (min < 1) return 'recién';
  if (min < 60) return `hace ${min} min`;
  if (min < 60 * 24) return `hace ${Math.round(min / 60)} h`;
  return `hace ${Math.round(min / 60 / 24)} días`;
}

function tinte(hex) {
  return hex + '26'; // ~15% de opacidad
}

const CABECERA = ['lun', 'mar', 'mié', 'jue', 'vie', 'sáb', 'dom'];

function eventoItem(i) {
  const e = el('div', 'item evento');
  e.style.background = tinte(colorDe(i.materia));
  const linea = el('div');
  linea.append(el('span', i.hora ? 'hora' : 'hora todo-dia', i.hora ?? 'todo el día'), el('span', 'titulo', i.titulo));
  e.append(linea, el('div', 'materia', i.materia.nombre));
  return e;
}

function dibujar() {
  const titulo = mes.toLocaleDateString('es-AR', { month: 'long', year: 'numeric' });
  $('rango').textContent = titulo[0].toUpperCase() + titulo.slice(1);
  const estado = $('estado');
  estado.textContent = `Último cambio ${haceCuanto(datos.generado)}${aviso ? ` · ${aviso}` : ''}`;
  estado.classList.toggle('aviso', !!aviso);

  const hoy = ymd(new Date());
  const cont = $('mes');
  cont.replaceChildren(...CABECERA.map(c => el('div', 'cab', c)));
  const semanas = armarMes(datos, mes);
  for (const d of semanas.flat()) {
    const clases = ['dia'];
    if (d.fecha < hoy) clases.push('pasado');
    if (d.fecha === hoy) clases.push('hoy');
    if (!d.delMes) clases.push('fuera');
    if (d.fecha === elegido) clases.push('elegido');
    const caja = el('div', clases.join(' '));
    caja.append(el('span', 'num', String(Number(d.fecha.slice(8)))));
    for (const i of d.items) {
      const chip = el('div', 'chip');
      const color = colorDe(i.materia);
      chip.style.borderColor = color;
      chip.style.background = tinte(color);
      chip.title = `${i.hora ?? 'todo el día'} ${i.titulo} · ${i.materia.nombre}`;
      if (i.hora) chip.append(el('span', 'hora', i.hora));
      chip.append(i.titulo);
      caja.append(chip);
    }
    caja.onclick = () => { elegido = d.fecha; dibujar(); };
    cont.append(caja);
  }

  // Detalle del día elegido: en el celular los cuadros son chicos para leer los eventos.
  const det = $('detalle');
  const dia = semanas.flat().find(d => d.fecha === elegido);
  det.replaceChildren();
  if (dia) {
    const [a, m, n] = dia.fecha.split('-').map(Number);
    const t = new Date(a, m - 1, n).toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long' });
    det.append(el('h2', '', t[0].toUpperCase() + t.slice(1)));
    if (!dia.items.length) det.append(el('div', 'vacio', 'Sin eventos'));
    for (const i of dia.items) det.append(eventoItem(i));
  }
}

function pedirToken(error) {
  $('app').hidden = true;
  $('formToken').hidden = false;
  $('errorToken').hidden = !error;
  $('errorToken').textContent = error ?? '';
}

async function cargar() {
  const token = localStorage.getItem(K_TOKEN);
  if (!token) return pedirToken();
  let r;
  try {
    r = await fetch(URL_DATOS, { headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github.raw' }, cache: 'no-store' });
  } catch {
    return usarCopia('sin conexión');
  }
  if (r.status === 401 || r.status === 403) {
    localStorage.removeItem(K_TOKEN);
    return pedirToken('Token inválido o vencido.');
  }
  // 404: todavía no se subió calendario.json, o el token no ve codetion-datos. El token se conserva.
  if (r.status === 404) return usarCopia('no se encontró calendario.json: sincronizá Codetion o revisá el acceso del token');
  if (!r.ok) return usarCopia(`error ${r.status}`);
  const texto = await r.text();
  try {
    datos = JSON.parse(texto);
  } catch {
    return usarCopia('datos inválidos');
  }
  localStorage.setItem(K_COPIA, texto);
  aviso = '';
  mostrar();
}

function usarCopia(motivo) {
  const copia = localStorage.getItem(K_COPIA);
  if (!copia) {
    $('formToken').hidden = true;
    $('app').hidden = false;
    $('estado').textContent = `No se pudo cargar (${motivo}) y no hay copia guardada.`;
    $('estado').classList.add('aviso');
    return;
  }
  datos = JSON.parse(copia);
  aviso = motivo;
  mostrar();
}

function mostrar() {
  $('formToken').hidden = true;
  $('app').hidden = false;
  dibujar();
}

$('formToken').addEventListener('submit', (ev) => {
  ev.preventDefault();
  localStorage.setItem(K_TOKEN, $('token').value.trim());
  $('token').value = '';
  cargar();
});
const mover = (n) => { mes = new Date(mes.getFullYear(), mes.getMonth() + n, 1); dibujar(); };
$('ant').onclick = () => mover(-1);
$('sig').onclick = () => mover(1);
$('hoy').onclick = () => { mes = new Date(); elegido = ymd(mes); dibujar(); };
document.addEventListener('visibilitychange', () => { if (!document.hidden && localStorage.getItem(K_TOKEN)) cargar(); });

cargar();
</script>
</body>
</html>
